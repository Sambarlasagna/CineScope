services:

  # ── Existing Services ────────────────────────────────────────────
  db:
    image: postgres:16-alpine

    #if the container crashed or the server reboots docker will automatically restart it
    restart: unless-stopped
    environment:
      POSTGRES_DB:       movie_reviews
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: jaya
    #Maps the named volume 'postgres_data'(stored on ur hard drive) 
    #to the path '/var/lib/postgresql/data' inside the container where PostgreSQl saves its files
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      #this will check if the database is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_reviews"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    #instead of prebuilt images we r telling docker to build one from our code
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      #connect to the databse service
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     movie_reviews
      DB_USER:     postgres
      DB_PASSWORD: jaya
    ports:
      - "8000:8000"
    #Wait to start the backend until the database passes the healthcheck we defined earlier.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── Monitoring Stack ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    #Injects your local configuration file into the container
    # :ro stands for "Read-Only" so the container can't accidentally alter your local file.
    volumes:  
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      #Tells Prometheus where its config file is.
      - "--config.file=/etc/prometheus/prometheus.yml"

      #Tells Prometheus to automatically delete metrics data 
      #older than 15 days to save your hard drive space.
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: cinescope123
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:jaya@db:5432/movie_reviews?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://frontend/stub_status"
    depends_on:
      - frontend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
